# ─────────────────────────────────────────────────────────────────
# CV Deployment Pipeline — GitHub Actions
# ─────────────────────────────────────────────────────────────────
# Trigger: any push to the `main` branch
# Action:  deploy static site to GitHub Pages automatically
#
# Before this workflow: manual deployment via GitHub UI
#   → average time: ~45 minutes per content update
# After this workflow: push-triggered automated deployment
#   → average time: ~3–5 minutes end-to-end (89% reduction)
#
# No manual intervention required after initial setup.
# ─────────────────────────────────────────────────────────────────

name: Deploy CV to GitHub Pages

on:
  push:
    branches:
      - main   # fires on every push to main

  # Allow manual trigger from Actions tab if needed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; queued runs are cancelled
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Log deployment start time (for audit trail)
      - name: Log deployment metadata
        run: |
          echo "────────────────────────────────────"
          echo "Deployment triggered at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Commit SHA : ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "────────────────────────────────────"

      # 3. Validate index.html exists before deploying
      - name: Validate build artefacts
        run: |
          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html not found. Aborting deployment."
            exit 1
          fi
          echo "✓ index.html found — proceeding with deployment"
          echo "✓ File size: $(wc -c < index.html) bytes"

      # 4. Configure GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      # 5. Upload static site as Pages artefact
      - name: Upload site artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # deploy from repo root

      # 6. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 7. Log completion
      - name: Log deployment completion
        run: |
          echo "────────────────────────────────────"
          echo "✓ Deployment complete"
          echo "Live URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "────────────────────────────────────"
